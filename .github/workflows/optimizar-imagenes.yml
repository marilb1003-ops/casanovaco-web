# Cada vez que se sube una foto de producto, la achica y la comprime solita.
name: Optimizar fotos

on:
  push:
    branches: [main]
    paths:
      - 'public/imagenes/productos/**'
  workflow_dispatch: # permite correrlo a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar herramienta de imágenes
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Optimizar
        working-directory: scripts
        run: node optimizar-imagenes.mjs ../public/imagenes/productos

      - name: Guardar fotos optimizadas
        run: |
          if [ -n "$(git status --porcelain public/imagenes/productos)" ]; then
            git config user.name "casanovaco-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/imagenes/productos
            git commit -m "Optimizar fotos de productos"
            git push
          else
            echo "Nada para guardar."
          fi
